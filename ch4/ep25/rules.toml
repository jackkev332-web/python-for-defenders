# Watchdog rules: one [[rule]] per detection.
# pattern is a regex with a group named ip. Single quotes keep backslashes as they are.

[[rule]]
name = "ssh-password-guessing"
log = "auth"
pattern = 'Failed password for (invalid user )?\S+ from (?P<ip>\S+)'
threshold = 5

[[rule]]
name = "web-scanner"
log = "web"
pattern = '^(?P<ip>\S+) .* 404 '
threshold = 10

[[rule]]
name = "ssh-root-guessing"
log = "auth"
pattern = 'Failed password for root from (?P<ip>\S+)'
threshold = 20
